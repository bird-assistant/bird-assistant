name: private-cloud-vault-ci
on:
  pull_request:
    paths:
      - 'cloudfunctions/birdPrivateVault/**'
      - '.github/workflows/cloud-vault-ci.yml'
      - 'package.json'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudfunctions/birdPrivateVault/package-lock.json
      - run: npm run verify:cloud
