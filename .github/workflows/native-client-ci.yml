name: native-client-ci

on:
  pull_request:
    paths:
      - "miniprogram/**"
      - ".github/workflows/native-client-ci.yml"
  push:
    branches: [main]
    paths:
      - "miniprogram/**"
      - ".github/workflows/native-client-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: miniprogram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run setup
      - run: npm run verify
