[supervisord]
logfile=/root/.local/share/bird-personal/supervisord.log
pidfile=/root/.local/share/bird-personal/supervisord.pid
childlogdir=/root/.local/share/bird-personal

[unix_http_server]
file=/root/.local/share/bird-personal/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///root/.local/share/bird-personal/supervisor.sock

[program:vision]
command=/bin/bash /root/.local/share/bird-personal/deploy/course/gpu-vision.sh
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=30

[program:tunnel]
command=/bin/bash /root/.local/share/bird-personal/deploy/course/gpu-tunnel.sh
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
